<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8d1233">
<meta name="application-name" content="Goda ģimene">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goda ģimene">
<meta name="format-detection" content="telephone=no">
<title>Latvijas Goda ģimene</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  @font-face{
    font-family:"DINRoundPro";
    src:url("assets/DINRoundPro-Light.woff2") format("woff2");
    font-weight:300;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"DINRoundPro";
    src:url("assets/DINRoundPro-Regular.woff2") format("woff2");
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"DINRoundPro";
    src:url("assets/DINRoundPro-Medium.woff2") format("woff2");
    font-weight:500;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"DINRoundPro";
    src:url("assets/DINRoundPro-Bold.woff2") format("woff2");
    font-weight:700;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"DINRoundPro";
    src:url("assets/DINRoundPro-Black.woff2") format("woff2");
    font-weight:900;
    font-style:normal;
    font-display:swap;
  }

  :root{
    --wine:#93102d;
    --wine-deep:#760c28;
    --wine-bright:#a0193e;
    --cream:#f2e5d6;
    --statusbar-h:44px;
    --font-ui:"DINRoundPro","Segoe UI","Helvetica Neue",Arial,sans-serif;

    /* Official brand ornament used across the app's red surfaces */
    --brand-pattern:url("assets/ornament-overlay.svg");
    --soft-pattern:url("assets/ornament-soft.svg?v=2");
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(900px 700px at 50% 18%, #391523 0%, #1c0b11 52%, #100609 100%);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  button{font-family:inherit;touch-action:manipulation;}
  button,a{-webkit-tap-highlight-color:transparent;}
  input,textarea{-webkit-user-select:text;user-select:text;}

  .phone{
    position:relative;
    width:min(100vw,390px);
    height:min(100dvh,844px);
    overflow:hidden;
    isolation:isolate;
    background:
      radial-gradient(90% 55% at 50% 0%, rgba(255,255,255,.075), transparent 72%),
      radial-gradient(130% 80% at 50% 108%, #a41535 0%, transparent 60%),
      linear-gradient(178deg, #92102d 0%, var(--wine) 48%, #830d28 100%);
    box-shadow:0 34px 80px rgba(0,0,0,.6);
  }

  /* woven pattern over the whole red surface */
  .phone::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:var(--brand-pattern);
    background-size:45px auto;
    pointer-events:none;
  }

  /* gentle vignette so the centre of the screen feels lit */
  .phone::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(120% 74% at 50% 45%, transparent 52%, rgba(34,0,9,.30) 100%);
    pointer-events:none;
  }

  .screen{
    position:relative;
    z-index:1;
    height:100%;
  }

  /* ---------- status bar ---------- */
  .statusbar{
    height:var(--statusbar-h);
    padding:0 12px 0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:#fff;
  }
  .clock{
    font-size:15px;
    font-weight:600;
    letter-spacing:.2px;
  }
  .status-icons{
    display:flex;
    align-items:center;
    gap:6px;
    color:#fff;
  }
  .status-icons svg{display:block;}

  /* ---------- header ---------- */
  .topbar{
    height:70px;
    padding:0 10px 0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    display:inline-flex;
    color:var(--cream);
    text-decoration:none;
    line-height:0;
  }
  .brand img{
    width:58px;
    height:auto;
    display:block;
    filter:drop-shadow(0 1px 1px rgba(45,0,10,.25));
  }
  .top-actions{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .icon-btn{
    width:38px;
    height:38px;
    padding:0;
    display:grid;
    place-items:center;
    background:none;
    border:0;
    color:#fff;
    cursor:pointer;
    transition:opacity .16s ease, transform .16s ease;
  }
  .icon-btn svg{width:28px;height:28px;display:block;}
  .icon-btn:hover{opacity:.78;}
  .icon-btn:active{transform:scale(.92);}

  /* ---------- primary menu ---------- */
  .menu{
    position:absolute;
    top:20.3%;
    left:50%;
    transform:translateX(-50%);
    width:66%;
    display:flex;
    flex-direction:column;
    gap:13px;
  }
  .menu-btn{
    height:46px;
    padding:0 14px;
    border:1.4px solid rgba(255,255,255,.94);
    border-radius:5px;
    background:rgba(255,255,255,.03);
    color:#fff;
    font-size:16px;
    font-weight:600;
    letter-spacing:.2px;
    text-shadow:0 1px 2px rgba(40,0,10,.22);
    cursor:pointer;
    transition:background .18s ease, transform .14s ease;
  }
  .menu-btn:hover{background:rgba(255,255,255,.10);}
  .menu-btn:active{transform:scale(.985);}

  .menu-btn:focus-visible,
  .icon-btn:focus-visible{
    outline:2px solid #ffdf9e;
    outline-offset:2px;
  }

  /* ---------- white bottom panel ---------- */
  .bottom-panel{
    position:absolute;
    top:67%;
    left:0;
    right:0;
    bottom:0;
    background:#fff;
    overflow:hidden;
    box-shadow:0 -8px 24px rgba(40,0,10,.07);
    display:flex;
    flex-direction:column;
  }
  .bottom-panel::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:var(--soft-pattern);
    background-size:45px auto;
    pointer-events:none;
  }

  /* ---------- QR error ---------- */
  .qr-view{
    width:min(73vw,286px);
    max-width:calc(100% - 24px);
    max-height:calc(100dvh - 32px);
    border:0;
    padding:24px 19px 18px;
    overflow:auto;
    overscroll-behavior:contain;
    background:#f2f2f2;
    border-radius:12px;
    box-shadow:0 10px 26px rgba(24,16,18,.16);
    text-align:center;
  }
  .qr-view::backdrop{ background:rgba(24,8,14,.18); }
  .qr-icon{
    display:block;
    width:46px;
    height:auto;
    margin:0 auto 12px;
  }
  .qr-title{
    max-width:18ch;
    margin:0 auto 12px;
    font-size:18px;
    font-weight:700;
    color:#2c3440;
    line-height:1.2;
    text-wrap:balance;
  }
  .qr-body{
    max-width:27ch;
    margin:0 auto 14px;
    font-size:14px;
    color:#454d57;
    line-height:1.4;
  }
  .qr-divider{
    border:0;
    border-top:1px solid #dcdde0;
    margin:0 0 12px;
  }
  .qr-btn{
    display:block;
    width:100%;
    min-height:44px;
    padding:8px 12px;
    background:#b90d33;
    border:0;
    border-radius:8px;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .qr-btn:hover{ background:var(--wine); }
  .qr-btn:active{ background:var(--wine-deep); }
  .qr-btn:focus-visible{ outline:2px solid var(--wine-deep); outline-offset:2px; }
  .qr-code{
    margin:12px 0 0;
    font-size:11px;
    line-height:1.4;
    color:#5c636c;
  }
  @media (max-height:720px){
    .qr-view{ padding-top:16px; padding-bottom:14px; }
    .qr-icon{ width:38px; margin-bottom:8px; }
    .qr-title{ margin-bottom:8px; }
    .qr-body{ margin-bottom:10px; }
    .qr-divider{ margin-bottom:8px; }
    .qr-code{ margin-top:8px; }
  }

  /* 3D card — sits across the red/white divide, as in the design */
  .card-container {
    position: absolute;
    top: 58.2%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 89%;
    max-width: 350px;
    aspect-ratio: 1.586;
    z-index: 5;
    pointer-events: none;
  }
  .card-container canvas {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
    opacity: 0;
    filter: saturate(1.45) contrast(1.06) brightness(1.15) drop-shadow(0 14px 18px rgba(45, 0, 10, .22));
  }
  .card-container.is-ready canvas {
    opacity: 1;
  }

  /* fullscreen card view */
  .card-container.is-fullscreen {
    position: absolute;
    inset: 0;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    aspect-ratio: auto;
    transform: none;
    z-index: 30;
    pointer-events: auto;
    overflow: hidden;
    isolation: isolate;
    background-color: var(--wine);
    background-image:
      radial-gradient(120% 70% at 50% 18%, rgba(255,255,255,.10), transparent 62%),
      var(--brand-pattern);
    background-size: auto, 45px auto;
    box-shadow: inset 0 0 110px rgba(28, 0, 8, .38);
  }
  .card-container.is-fullscreen canvas {
    filter: saturate(1.45) contrast(1.06) brightness(1.15) drop-shadow(0 26px 44px rgba(18, 0, 6, .42));
  }
  .card-fs-close {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 3;
    display: none;
    place-items: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 1px solid rgba(255,255,255,.34);
    border-radius: 50%;
    background: rgba(255,255,255,.13);
    color: #fff;
    cursor: pointer;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: background .16s ease, transform .16s ease;
  }
  .card-container.is-fullscreen .card-fs-close {
    display: grid;
  }
  .card-fs-close svg {
    width: 20px;
    height: 20px;
    display: block;
  }
  .card-fs-close:hover { background: rgba(255,255,255,.24); }
  .card-fs-close:active { transform: scale(.92); }
  .card-fs-close:focus-visible {
    outline: 2px solid #ffdf9e;
    outline-offset: 2px;
  }
  .card-fs-hint {
    position: absolute;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    z-index: 2;
    display: none;
    margin: 0;
    width: max-content;
    max-width: 90%;
    color: rgba(255,255,255,.74);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: .35px;
    line-height: 1.3;
    text-align: center;
    pointer-events: none;
  }
  .card-container.is-fullscreen .card-fs-hint {
    display: block;
  }
  .tabbar{
    position:absolute;
    left:0;
    right:0;
    bottom:12px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    align-items:center;
    padding:0 10px;
    gap:4px;
    z-index:3;
  }
  .tab{
    border:0;
    background:none;
    cursor:pointer;
    color:#a20c33;
    font:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:2px 4px 8px;
  }
  .tab__badge{
    display:contents;
  }
  .tab__icon{
    width:22px;
    height:22px;
    display:block;
  }
  .tab__label{
    font-size:12.5px;
    font-weight:600;
    line-height:1.24;
    text-align:center;
  }
  .tab__underline{
    width:34px;
    height:2px;
    border-radius:1px;
    background:transparent;
    margin-top:-3px;
    transition:background .18s ease;
  }
  .tab.is-active .tab__underline{
    background:#a20c33;
  }
  .tab:hover .tab__label{ opacity:.78; }
  .tab:active{ transform:scale(.97); }


  /* ---------- profile / settings screen ---------- */
  .profile-screen{
    position:absolute;
    top:var(--statusbar-h);
    left:0;
    right:0;
    bottom:0;
    z-index:40;
    display:flex;
    flex-direction:column;
    background:#fff;
    transform:translateX(100%);
    visibility:hidden;
    transition:transform .3s cubic-bezier(.25,.8,.35,1), visibility 0s linear .3s;
  }
  .profile-screen.is-open{
    transform:translateX(0);
    visibility:visible;
    transition:transform .3s cubic-bezier(.25,.8,.35,1);
  }
  .profile-head{
    position:relative;
    flex:0 0 54px;
    display:flex;
    align-items:center;
    gap:2px;
    padding:0 8px 0 6px;
    color:#fff;
    background:
      radial-gradient(120% 160% at 50% 0%, rgba(255,255,255,.09), transparent 68%),
      linear-gradient(180deg,#8d1233 0%,#7e0e2b 100%);
    overflow:hidden;
  }
  .profile-head::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:var(--brand-pattern);
    background-size:45px auto;
    pointer-events:none;
  }
  .profile-head > *{ position:relative; z-index:1; }
  .profile-head .icon-btn{
    width:38px;
    height:38px;
    flex:0 0 auto;
    color:#fff;
  }
  .profile-head .icon-btn:hover{ opacity:.78; }
  .profile-back svg{ width:25px; height:25px; display:block; }
  .profile-logo{
    width:36px;
    height:auto;
    display:block;
    margin-left:3px;
    filter:drop-shadow(0 1px 1px rgba(45,0,10,.25));
  }
  .profile-head-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
  }
  .profile-head-actions .icon-btn svg{ width:26px; height:26px; }
  .profile-body{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:#fff;
  }
  .profile-view{
    padding:0 20px 30px;
  }
  .profile-view[hidden]{ display:none; }
  .profile-title{
    margin:15px 0 2px;
    font-size:18.5px;
    line-height:1.25;
    font-weight:700;
    color:#161616;
    letter-spacing:.1px;
  }
  .profile-list{
    display:flex;
    flex-direction:column;
  }
  .profile-row{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    min-height:62px;
    padding:0 2px;
    border:0;
    border-bottom:1px solid #ececec;
    background:none;
    color:#161616;
    font:inherit;
    text-align:left;
    cursor:pointer;
  }
  .profile-row:last-child{ border-bottom:0; }
  .profile-row:active{ background:#faf6f7; }
  .profile-row:focus-visible{ outline:2px solid #a20c33; outline-offset:-2px; }
  .profile-row__icon{
    flex:0 0 24px;
    width:24px;
    height:24px;
    color:#a20c33;
    display:grid;
    place-items:center;
  }
  .profile-row__icon svg{ width:22px; height:22px; display:block; }
  .profile-row__label{
    flex:1 1 auto;
    font-size:15.5px;
    font-weight:700;
    color:#181818;
    letter-spacing:.15px;
  }
  .profile-row__chevron{
    flex:0 0 18px;
    width:18px;
    height:18px;
    color:#bcbcbc;
  }
  .profile-row__chevron svg{ width:18px; height:18px; display:block; }

  /* settings form */
  .settings-form{
    display:flex;
    flex-direction:column;
    gap:16px;
    padding-top:10px;
  }
  .field{ display:block; }
  .field__label{
    display:block;
    margin:0 0 7px 2px;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.7px;
    text-transform:uppercase;
    color:#858585;
  }
  .field input{
    width:100%;
    height:48px;
    padding:0 14px;
    border:1px solid #ddd8d8;
    border-radius:10px;
    background:#fbfafa;
    color:#141414;
    font-family:inherit;
    font-size:16px;
    font-weight:400;
    outline:none;
    transition:border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }
  .field input::placeholder{ color:#a9a2a2; }
  .field input:focus{
    border-color:#a20c33;
    background:#fff;
    box-shadow:0 0 0 3px rgba(162,12,51,.12);
  }
  .number-row{ display:flex; gap:8px; }
  .number-row input{
    flex:1 1 auto;
    min-width:0;
    color:#5c5c5c;
    letter-spacing:.6px;
  }
  .regen-btn{
    flex:0 0 48px;
    width:48px;
    height:48px;
    display:grid;
    place-items:center;
    padding:0;
    border:1px solid #ddd8d8;
    border-radius:10px;
    background:#fff;
    color:#a20c33;
    cursor:pointer;
    transition:background .16s ease, transform .16s ease;
  }
  .regen-btn svg{ width:20px; height:20px; display:block; }
  .regen-btn:hover{ background:#faf2f4; }
  .regen-btn:active{ transform:scale(.94); }
  .regen-btn:focus-visible{ outline:2px solid #a20c33; outline-offset:2px; }
  .settings-note{
    margin:0 2px;
    font-size:12px;
    line-height:1.5;
    color:#8a8a8a;
  }
  .save-btn{
    height:50px;
    margin-top:4px;
    border:0;
    border-radius:10px;
    background:#8d1233;
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    letter-spacing:.2px;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(141,18,51,.18);
    transition:background .16s ease, transform .12s ease;
  }
  .save-btn:hover{ background:#9d1639; }
  .save-btn:active{ transform:scale(.985); }
  .save-btn:focus-visible{ outline:2px solid #a20c33; outline-offset:2px; }
  .profile-screen .icon-btn:focus-visible{
    outline:2px solid #ffdf9e;
    outline-offset:2px;
  }


  /* ---------- home indicator ---------- */
  .home-indicator{
    position:absolute;
    bottom:9px;
    left:50%;
    transform:translateX(-50%);
    width:134px;
    height:5px;
    border-radius:99px;
    background:#101010;
    z-index:4;
  }

  /* on a desktop browser, present the screen as a handset */
  @media (min-width:440px) and (min-height:780px){
    .phone{
      border-radius:38px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.10),
        0 0 0 10px #090506,
        0 0 0 11px #3a232a,
        0 44px 100px rgba(0,0,0,.65);
    }
  }

  @media (max-height:720px){
    .menu{top:20%;}
    .menu-btn{height:38px;font-size:14px;}
    .menu{gap:10px;}
  }

  /* ---------- installed app (iPhone home screen) ---------- */
  @media all and (display-mode: standalone){
    :root{ --statusbar-h:max(44px, env(safe-area-inset-top)); }

    .phone{
      width:min(100%,480px);
      height:100dvh;
      border-radius:0;
      box-shadow:none;
    }

    /* the real iOS status bar takes over from the simulated one */
    .statusbar .clock,
    .statusbar .status-icons{ visibility:hidden; }

    /* let the profile header run behind the real status bar */
    .profile-screen{ top:0; }
    .profile-head{
      flex-basis:calc(54px + max(44px, env(safe-area-inset-top)));
      padding-top:max(44px, env(safe-area-inset-top));
    }

    .home-indicator{ display:none; }

    .tabbar{ bottom:calc(12px + env(safe-area-inset-bottom)); }
    .profile-view{ padding-bottom:calc(30px + env(safe-area-inset-bottom)); }

    .card-fs-close{ top:calc(16px + env(safe-area-inset-top)); }
    .card-fs-hint{ bottom:calc(18px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<main class="phone" aria-label="Goda ģimene mobilā lietotne">
  <div class="screen">

    <div class="statusbar" aria-hidden="true">
      <span class="clock">17:28</span>
      <span class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
          <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/>
          <rect x="5" y="5.8" width="3" height="6.2" rx="1" fill="currentColor"/>
          <rect x="10" y="3.4" width="3" height="8.6" rx="1" fill="currentColor"/>
          <rect x="15" y="1" width="3" height="11" rx="1" fill="currentColor"/>
        </svg>
        <svg width="17" height="13" viewBox="0 0 17 13" fill="none">
          <path d="M1.3 4.4C5.3.6 11.7.6 15.7 4.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M4 7.2c2.5-2.2 6.5-2.2 9 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M6.7 9.9c1-1 2.6-1 3.6 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>

<script>
  (function(){
    const qrError = document.getElementById('qr-error');
    const tabs = Array.from(document.querySelectorAll('.tab'));
    const qrTab = document.querySelector('[data-tab="qr"]');
    const title = document.getElementById('qr-error-title');
    const acknowledge = qrError.querySelector('.qr-btn');

    tabs.forEach(function(btn){
      btn.addEventListener('click', function(){
        const kind = btn.dataset.tab;
        const alreadyActive = btn.classList.contains('is-active');
        tabs.forEach(function(tab){ tab.classList.remove('is-active'); });

        if (kind === 'fullscreen') {
          document.dispatchEvent(new CustomEvent('card-fullscreen-open'));
          return;
        }

        if (!alreadyActive) btn.classList.add('is-active');

        if (kind === 'flip') {
          window.postMessage('flip-card', '*');
          return;
        }

        qrTab.setAttribute('aria-expanded', 'true');
        qrError.showModal();
        title.focus({ preventScroll: true });
      });
    });
    acknowledge.addEventListener('click', function(){ qrError.close(); });
    qrError.addEventListener('close', function(){
      qrTab.setAttribute('aria-expanded', 'false');
      qrTab.classList.remove('is-active');
      qrTab.focus({ preventScroll: true });
    });
  })();
</script>
<script>
  (function(){
    const KEY = 'streetcap.cardData.v1';
    const screen = document.getElementById('profile-screen');
    const body = document.getElementById('profile-body');
    const mainView = document.getElementById('profile-main');
    const settingsView = document.getElementById('profile-settings');
    const form = document.getElementById('card-settings-form');
    if (!screen || !form) return;

    const openers = [document.getElementById('menu-toggle'), document.getElementById('profile-toggle')].filter(Boolean);
    const backBtn = document.getElementById('profile-back');
    const closeBtn = document.getElementById('profile-menu');
    const settingsRow = document.querySelector('[data-profile="settings"]');
    const nameInput = document.getElementById('card-name');
    const birthInput = document.getElementById('card-birth');
    const validInput = document.getElementById('card-valid');
    const numberInput = document.getElementById('card-number');
    const regenBtn = document.getElementById('regenerate-number');
    const appLayers = Array.from(screen.parentElement.children).filter(function(el){ return el !== screen; });

    let inSettings = false;
    let lastFocus = null;
    let data = readData();

    function randomNumber(){
      // 12 random digits starting with 4, eg 445678901234
      const digits = '4' + String(Math.floor(Math.random() * 1e11)).padStart(11, '0');
      return digits;
    }

    function readData(){
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return { name:'', birth:'', valid:'', number:randomNumber() };
        const parsed = JSON.parse(raw);
        return {
          name: typeof parsed.name === 'string' ? parsed.name : '',
          birth: typeof parsed.birth === 'string' ? parsed.birth : '',
          valid: typeof parsed.valid === 'string' ? parsed.valid : '',
          number: (typeof parsed.number === 'string' && parsed.number ? parsed.number : randomNumber()).replace(/^LV\s*/i, '')
        };
      } catch (e) {
        return { name:'', birth:'', valid:'', number:randomNumber() };
      }
    }

    function fillForm(){
      if (!data.number) data.number = randomNumber();
      nameInput.value = data.name;
      birthInput.value = data.birth;
      validInput.value = data.valid;
      numberInput.value = data.number;
    }

    function showMain(){
      inSettings = false;
      mainView.hidden = false;
      settingsView.hidden = true;
      body.scrollTop = 0;
    }

    function showSettings(){
      inSettings = true;
      fillForm();
      mainView.hidden = true;
      settingsView.hidden = false;
      body.scrollTop = 0;
    }

    function openProfile(){
      lastFocus = document.activeElement;
      appLayers.forEach(function(el){ el.inert = true; });
      screen.classList.add('is-open');
      screen.removeAttribute('inert');
      screen.setAttribute('aria-hidden', 'false');
      showMain();
      if (backBtn) backBtn.focus({ preventScroll: true });
    }

    function closeProfile(){
      appLayers.forEach(function(el){ el.inert = false; });
      screen.classList.remove('is-open');
      if (lastFocus && typeof lastFocus.focus === 'function') {
        lastFocus.focus({ preventScroll: true });
      }
      screen.setAttribute('aria-hidden', 'true');
      screen.setAttribute('inert', '');
    }

    openers.forEach(function(btn){ btn.addEventListener('click', openProfile); });

    if (backBtn) backBtn.addEventListener('click', function(){
      if (inSettings) showMain(); else closeProfile();
    });
    if (closeBtn) closeBtn.addEventListener('click', closeProfile);
    if (settingsRow) settingsRow.addEventListener('click', showSettings);

    if (regenBtn) regenBtn.addEventListener('click', function(){
      numberInput.value = randomNumber();
      numberInput.focus({ preventScroll: true });
    });

    form.addEventListener('submit', function(event){
      event.preventDefault();
      data = {
        name: nameInput.value.replace(/\s+/g, ' ').trim(),
        birth: birthInput.value.trim(),
        valid: validInput.value.trim(),
        number: numberInput.value.trim().replace(/^LV\s*/i, '') || randomNumber()
      };
      try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
      window.dispatchEvent(new CustomEvent('streetcap-card-data', { detail: data }));
      closeProfile();
    });

    window.addEventListener('keydown', function(event){
      if (event.key === 'Escape' && screen.classList.contains('is-open')) {
        if (inSettings) showMain(); else closeProfile();
      }
    });
  })();
</script>
<script type="module">
  import * as THREE from './vendor/three/build/three.module.js';
  import { GLTFLoader } from './vendor/three/examples/jsm/loaders/GLTFLoader.js';

  const container = document.getElementById('card-3d-anchor');

  if (container) {
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.domElement.setAttribute('aria-hidden', 'true');
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(24, 1, 0.005, 2);

    // Lights are placed in front of the upright card so the printed face stays vivid.
    scene.add(new THREE.HemisphereLight(0xffffff, 0x3c4d34, 1.3));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(-0.12, 0.24, 0.32);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xfff2e2, 0.6);
    fill.position.set(0.24, 0.03, 0.2);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, 0.7);
    rim.position.set(0.05, 0.22, -0.3);
    scene.add(rim);

    // The card faces the viewer straight on. It no longer orbits freely,
    // so its edges can never be sliced off by the canvas bounds.
    // rig flips the card front/back; upright stands the modelled flat card up.
    const presentation = new THREE.Group();
    const rig = new THREE.Group();
    const upright = new THREE.Group();
    upright.rotation.x = Math.PI / 2;
    rig.add(upright);
    presentation.add(rig);
    scene.add(presentation);

    // Real-world card dimensions from the glTF (1 unit = 1 m).
    const CARD_W = 0.0856;
    const CARD_H = 0.05398;

    let isFullscreen = false;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function fitDistance() {
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const halfH = Math.tan(vFov / 2);
      const halfW = halfH * camera.aspect;
      // In fullscreen the card is turned 90°, so its axes swap.
      const wide = isFullscreen ? CARD_H : CARD_W;
      const tall = isFullscreen ? CARD_W : CARD_H;
      const padding = isFullscreen ? 1.12 : 1.09;
      const distance = Math.max((tall / 2) / halfH, (wide / 2) / halfW);
      return distance * padding;
    }

    function applyCameraDistance() {
      camera.position.set(0, 0, fitDistance());
      camera.lookAt(0, 0, 0);
    }

    function resize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      applyCameraDistance();
    }

    function updatePixelRatio() {
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 3));
      resize();
    }

    updatePixelRatio();
    window.addEventListener('resize', updatePixelRatio);

    const CARD_DATA_KEY = 'streetcap.cardData.v1';
    let frontTexture = null;
    let frontOriginal = null;
    let cardData = readCardData();

    function readCardData() {
      try {
        const raw = localStorage.getItem(CARD_DATA_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function drawFittedText(ctx, text, x, y, size, maxWidth, weight) {
      let fontSize = size;
      ctx.font = weight + ' ' + fontSize + 'px "DINRoundPro", Arial, sans-serif';
      while (fontSize > size * 0.7 && ctx.measureText(text).width > maxWidth) {
        fontSize -= 1;
        ctx.font = weight + ' ' + fontSize + 'px "DINRoundPro", Arial, sans-serif';
      }
      ctx.fillText(text, x, y, maxWidth);
    }

    function paintCardValues() {
      if (!frontTexture || !frontOriginal) return;
      const w = frontOriginal.width;
      const h = frontOriginal.height;
      if (!w || !h) return;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(frontOriginal, 0, 0, w, h);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#fffdf5';
      const fields = [
        ['Apliecības numurs:', cardData?.number, 0.04, 0.36, 0.660, 0.738],
        ['Dzimšanas datums:', cardData?.birth, 0.42, 0.29, 0.660, 0.738],
        ['Derīguma termiņš:', cardData?.valid, 0.733, 0.231, 0.660, 0.738],
        ['Apliecības īpašnieks:', cardData?.name, 0.04, 0.92, 0.845, 0.921]
      ];
      for (const [label, value, x, width, labelY, valueY] of fields) {
        drawFittedText(ctx, label, w * x, h * labelY, w * 0.025, w * width, 500);
        if (value) drawFittedText(ctx, String(value), w * x, h * valueY, w * 0.045, w * width, 700);
      }
      frontTexture.image = canvas;
      frontTexture.needsUpdate = true;
    }

    window.addEventListener('streetcap-card-data', (event) => {
      if (event.detail) {
        cardData = event.detail;
        paintCardValues();
      }
    });

    const loader = new GLTFLoader();
    loader.load(
      'streetcap_card.glb?v=35442c51',
      (gltf) => {
        const card = gltf.scene;
        upright.add(card);

        card.traverse((object) => {
          if (!object.isMesh) return;
          const materials = Array.isArray(object.material) ? object.material : [object.material];
          materials.forEach((material) => {
            if (material && material.name === 'CardFront' && material.map && !frontTexture) {
              frontTexture = material.map;
              frontOriginal = material.map.image;
            }
          });
        });

        if (frontTexture) {
          paintCardValues();
          if (document.fonts && document.fonts.load) {
            Promise.all([
              document.fonts.load('500 24px DINRoundPro'),
              document.fonts.load('700 24px DINRoundPro')
            ]).then(paintCardValues).catch(() => {});
          }
        }

        container.classList.add('is-ready');
        resize();
      },
      undefined,
      (error) => {
        console.error('Card model failed to load:', error);
        container.classList.add('is-error');
      }
    );

    let flipped = false;
    let flip = null;

    const easeInOutCubic = (t) =>
      t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

    window.addEventListener('message', (event) => {
      if (event.data !== 'flip-card') return;
      flipped = !flipped;
      const angle = flipped ? Math.PI : 0;
      if (reducedMotion.matches) {
        flip = null;
        rig.rotation.y = angle;
        return;
      }
      flip = {
        from: rig.rotation.y,
        to: angle,
        start: performance.now(),
        duration: 140
      };
    });

    const closeBtn = container.querySelector('.card-fs-close');
    const fullscreenTab = document.querySelector('.tab[data-tab="fullscreen"]');

    function openFullscreen() {
      if (isFullscreen) return;
      isFullscreen = true;
      presentation.rotation.z = Math.PI / 2;
      container.classList.add('is-fullscreen');
      resize();
      if (closeBtn) closeBtn.focus({ preventScroll: true });
    }

    function closeFullscreen() {
      if (!isFullscreen) return;
      isFullscreen = false;
      presentation.rotation.z = 0;
      container.classList.remove('is-fullscreen');
      resize();
      if (fullscreenTab) fullscreenTab.focus({ preventScroll: true });
    }

    document.addEventListener('card-fullscreen-open', openFullscreen);
    if (closeBtn) closeBtn.addEventListener('click', closeFullscreen);
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && isFullscreen) closeFullscreen();
    });

    renderer.setAnimationLoop(() => {
      const now = performance.now();
      if (flip) {
        const t = Math.min(1, (now - flip.start) / flip.duration);
        rig.rotation.y = flip.from + (flip.to - flip.from) * easeInOutCubic(t);
        if (t >= 1) {
          rig.rotation.y = flip.to;
          flip = null;
        }
      }
      renderer.render(scene, camera);
    });

    new ResizeObserver(resize).observe(container);
  }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
</script>
</body>
